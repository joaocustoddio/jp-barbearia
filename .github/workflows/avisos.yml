name: Avisos da barbearia

# O Render (plano free) hiberna quando ninguém usa, então não dá pra ele mesmo
# rodar tarefa agendada. Este workflow é o "despertador": chama a API nos
# horários certos e ela manda os avisos no Telegram da equipe.
#
# Antes de funcionar, cadastre em Settings > Secrets and variables > Actions:
#   API_URL       -> https://jp-barbearia-r9lq.onrender.com
#   TAREFAS_TOKEN -> o mesmo valor configurado no Render

on:
  schedule:
    # Atenção: GitHub usa UTC. Brasília é UTC-3.
    - cron: "0 11 * * *"    # 08:00 de Brasília — resumo do dia (Telegram)
    - cron: "0 21 * * *"    # 18:00 de Brasília — agenda de amanhã (Telegram)
    # Lembrete do cliente por email, ~1h antes do horário dele — e, de quebra,
    # mantém o servidor acordado durante o expediente.
    #
    # A cada 10 MINUTOS de propósito: a hospedagem hiberna o serviço após 15
    # minutos parado. Com intervalo de 30 min ele dormia entre uma chamada e
    # outra, e o cliente pegava o site "fora do ar" enquanto o servidor subia.
    # 10 < 15, então ele fica de pé o expediente inteiro.
    #
    # Das 06h às 00h de Brasília — 18h por dia. Como o GitHub agenda em UTC e
    # essa janela cruza a meia-noite daqui, ela vira duas faixas:
    #   9-23 UTC = 06h00–20h59  |  0-2 UTC = 21h00–23h59
    # Começa 06h pra o servidor já estar quente antes do primeiro corte (08:00
    # no sábado) e vai até meia-noite, que é quando as pessoas marcam de casa.
    # Consumo: ~558h/mês das 750h gratuitas — sobra margem pra deploys e picos.
    # Minutos QUEBRADOS de propósito (3, 13, 23...) em vez de */10. O GitHub
    # atrasa e às vezes DESCARTA execuções agendadas quando está sob carga, e o
    # pico é sempre no topo da hora — a própria documentação deles manda fugir
    # do :00. Medido em 28/08: com */10 o intervalo real ficou em 63min de
    # média (deveria ser 10), com buracos de até 406min em pleno expediente.
    # Isto ajuda, mas NÃO resolve: pra manter o servidor acordado de verdade o
    # certo é um pingador externo (cron-job.org/UptimeRobot), que é feito pra
    # isso. Ver o README.
    - cron: "3,13,23,33,43,53 0-2,9-23 * * *"
  workflow_dispatch:        # permite disparar na mão pra testar
    inputs:
      tipo:
        description: "Qual aviso enviar"
        type: choice
        options: [lembretes, resumo, proximos]
        default: lembretes

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir se já está configurado
        id: conferir
        # Enquanto os secrets não existirem, o workflow termina em verde sem
        # fazer nada — em vez de falhar e mandar email de erro a cada meia hora.
        run: |
          if [ -z "${{ secrets.API_URL }}" ] || [ -z "${{ secrets.TAREFAS_TOKEN }}" ]; then
            echo "::notice::Secrets API_URL e/ou TAREFAS_TOKEN ainda não cadastrados — nada a enviar."
            echo "pronto=nao" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=sim" >> "$GITHUB_OUTPUT"
          fi

      - name: Definir o tipo do aviso
        id: definir
        if: steps.conferir.outputs.pronto == 'sim'
        run: |
          case "${{ github.event.schedule }}" in
            "0 11 * * *")       TIPO=resumo ;;     # 08:00 BRT
            "0 21 * * *")       TIPO=lembretes ;;  # 18:00 BRT
            "3,13,23,33,43,53 0-2,9-23 * * *") TIPO=proximos ;;   # de 10 em 10 min
            *)                  TIPO="${{ inputs.tipo }}" ;;
          esac
          [ -n "$TIPO" ] || TIPO=lembretes
          echo "tipo=$TIPO" >> "$GITHUB_OUTPUT"
          echo "Enviando aviso do tipo: $TIPO"

      - name: Acordar o servidor
        if: steps.conferir.outputs.pronto == 'sim'
        # Primeira chamada pode demorar (~50s) porque o serviço estava dormindo.
        run: curl -sS -m 120 --retry 3 --retry-delay 15 --retry-all-errors "${{ secrets.API_URL }}/" || true

      - name: Enviar o aviso
        if: steps.conferir.outputs.pronto == 'sim'
        run: |
          curl -sS -f -m 120 --retry 3 --retry-delay 15 --retry-all-errors \
            -X POST \
            -H "X-Tarefa-Token: ${{ secrets.TAREFAS_TOKEN }}" \
            "${{ secrets.API_URL }}/api/tarefas/avisos?tipo=${{ steps.definir.outputs.tipo }}"
