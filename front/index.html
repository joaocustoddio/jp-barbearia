<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JP Barbearia — Agendamento</title>
  <link rel="stylesheet" href="style.css?v=15" />
  <link rel="icon" type="image/png" href="img/favicon.PNG">

  <!-- App instalável (PWA): ícone na tela do celular e abertura em tela cheia -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a0c11" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="JP Barbearia" />
</head>
<body>

  <div class="page">

    <header class="topbar">
      <div class="brand">
        <div class="avatar">JP</div>
        <div class="brand-text">
          <h1>JP Barbearia</h1>
          <p class="tagline">Agendamento online</p>
        </div>
      </div>
      <div class="topbar-links">
        <a href="#" class="admin-link" id="link-cancelar">Meus agendamentos</a>
        <a href="admin.html" class="admin-link" id="link-admin">Área do barbeiro</a>
      </div>
    </header>

    <nav class="stepper" id="stepper" aria-label="Etapas do agendamento"></nav>

    <main class="step-content" id="step-content"></main>

  </div>

  <!-- Medição de campanha. O nome do arquivo evita "pixel"/"ads" de propósito:
       bloqueador derruba por nome, e aí a função sumiria. A linha seguinte
       garante que ela exista de qualquer jeito — sem ela, um bloqueador
       quebraria o agendamento, que é o contrário do objetivo. -->
  <script src="medicao.js?v=1"></script>
  <script>window.pixel = window.pixel || function () {};</script>
  <script src="mockData.js?v=7"></script>
  <script src="api.js?v=35"></script>
  <script src="script.js?v=29"></script>

  <!-- Registra o service worker (habilita instalar como app e uso offline) -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => { /* sem app offline, segue normal */ });
      });
    }
  </script>
</body>
</html>
